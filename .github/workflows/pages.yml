name: Deploy animation preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate animation scripts
        shell: bash
        run: |
          node --check animation.js
          node --check enhancements.js
          node --check early-scenes.js
          node --check scientific-polish.js
          node --check timing-fixes.js
          node --check transition-polish.js

      - name: Prepare animation preview
        shell: bash
        run: |
          rm -rf _site _qa
          mkdir -p _site _qa
          cp index.html animation.js styles.css timeline.json enhancements.js enhancements.css early-scenes.js scientific-polish.js timing-fixes.js transition-polish.js _site/
          # Keep the stable base build untouched; inject iterative animation layers only in the live preview.
          sed -i 's#</head>#<link rel="stylesheet" href="enhancements.css" />\n</head>#' _site/index.html
          sed -i 's#</body>#<script src="enhancements.js"></script>\n<script src="early-scenes.js"></script>\n<script src="scientific-polish.js"></script>\n<script src="timing-fixes.js"></script>\n<script src="transition-polish.js"></script>\n</body>#' _site/index.html
          touch _site/.nojekyll

      - name: Render QA keyframes
        shell: bash
        run: |
          python3 -m http.server 8000 --directory _site >/tmp/crzne-http.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary on runner; skipping screenshots."
            kill "$SERVER_PID" || true
            exit 0
          fi
          for T in 12 24 34 40 52 56.5 58 60 66 74 84 89; do
            SAFE_T="${T/./_}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=1200 --screenshot="_qa/t${SAFE_T}.png" "http://127.0.0.1:8000/?t=${T}&present=1" >/tmp/chrome-${SAFE_T}.log 2>&1 || true
          done
          kill "$SERVER_PID" || true
          ls -lh _qa || true

      - name: Upload QA keyframes
        uses: actions/upload-artifact@v4
        with:
          name: qa-keyframes
          path: _qa/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
