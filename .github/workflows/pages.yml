name: Deploy animation preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare animation preview
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html animation.js styles.css timeline.json enhancements.js enhancements.css _site/
          # Keep the stable base build untouched; inject the iterative animation layer only in the preview.
          sed -i 's#</head>#<link rel="stylesheet" href="enhancements.css" />\n</head>#' _site/index.html
          sed -i 's#</body>#<script src="enhancements.js"></script>\n</body>#' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
