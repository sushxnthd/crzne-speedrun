name: Verify every frame and deploy IRIS animation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all animation scripts
        run: |
          for f in *.js scripts/*.cjs; do node --check "$f"; done
      - name: Audit, reverse-seek check, and render all 2700 frames
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then npx playwright install --with-deps chromium; unset CHROME; fi
          QA_ALL_FRAMES=1 npm run qa
      - name: Encode 1080p animation master
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -framerate 30 -i qa/frames/%04d.png -frames:v 2700 -c:v libx264 -crf 17 -pix_fmt yuv420p -movflags +faststart qa/animation-master.mp4
      - name: Verify recording-conformed framing and typography
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || true)"
          QA_OUT=qa-recorded node scripts/render-recorded.cjs
      - name: Verify transparent motion overlays
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || true)"
          QA_OUT=qa-motion node scripts/render-motion.cjs
          QA_OUT=qa-motion node scripts/check-motion-seeks.cjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-qa
          path: |
            qa/frame-audit.json
            qa/key-*.png
            qa/detail-*.png
            qa/overlay-69.png
            qa/animation-master.mp4
            qa-recorded/frame-audit.json
            qa-recorded/key-*.png
            qa-motion/motion-audit.json
            qa-motion/seek-qa.json
            qa-motion/key-*.png
          retention-days: 14
      - name: Prepare canonical preview
        run: |
          mkdir -p _site
          cp *.html *.js *.css timeline.json recording-timeline.json _site/
          cp -R fonts paper-assets _site/
          cp qa/animation-master.mp4 _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
