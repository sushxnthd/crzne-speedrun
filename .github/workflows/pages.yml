name: Deploy animation preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack exact animation build
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          base64 -d site.tar.gz.b64 > /tmp/crzne-site.tar.gz
          tar -xzf /tmp/crzne-site.tar.gz -C _site

      - name: Sync readable animation source back to repository
        shell: bash
        run: |
          cp _site/index.html ./index.html
          cp _site/animation.js ./animation.js
          cp _site/styles.css ./styles.css
          cp _site/timeline.json ./timeline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html animation.js styles.css timeline.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync generated animation source [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
